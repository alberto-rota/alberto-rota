name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Shared look: dark theme, no border
      COMMON: "theme=dark&hide_border=true"
      # PAT_1 (repo scope) enables count_private / include_all_commits.
      # Falls back to GITHUB_TOKEN, which only sees public data.
      TOKEN: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=alberto-rota&show_icons=true&${{ env.COMMON }}&include_all_commits=true&count_private=true&hide_title=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Pin - ground-control
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=alberto-rota&repo=ground-control&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-ground-control.svg
          token: ${{ env.TOKEN }}

      - name: Pin - sekrt
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=alberto-rota&repo=sekrt&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-sekrt.svg
          token: ${{ env.TOKEN }}

      - name: Pin - dasshboard-tui
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=alberto-rota&repo=dasshboard-tui&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-dasshboard-tui.svg
          token: ${{ env.TOKEN }}

      - name: Pin - dotfiles
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=alberto-rota&repo=dotfiles&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-dotfiles.svg
          token: ${{ env.TOKEN }}

      - name: Pin - DaSSHboard
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=alberto-rota&repo=DaSSHboard&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-dasshboard.svg
          token: ${{ env.TOKEN }}

      - name: Pin - MedView
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=FrancescaFati&repo=MedView&${{ env.COMMON }}&description_lines_count=2
          path: profile/pin-medview.svg
          token: ${{ env.TOKEN }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh README cards"
          git push
